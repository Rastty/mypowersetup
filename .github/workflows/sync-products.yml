name: Sync affiliate products

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/products.js"
      - "src/feed.js"
      - "scripts/sync-products.mjs"
      - ".github/workflows/sync-products.yml"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  products:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: node scripts/sync-products.mjs
        env:
          RESLSHOP_FEED_URL: ${{ secrets.RESLSHOP_FEED_URL }}
          SVETKARAVANU_FEED_URL: ${{ secrets.SVETKARAVANU_FEED_URL }}
          SOLAR_IMPORT_FEED_URL: ${{ secrets.SOLAR_IMPORT_FEED_URL }}
          BATTERY_CZ_FEED_URL: ${{ secrets.BATTERY_CZ_FEED_URL }}
      - run: node --test
      - name: Commit refreshed catalog
        run: |
          if git diff --quiet -- data/products.json; then exit 0; fi
          git config user.name "mypowersetup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- data/products.json
          git commit -m "data: refresh affiliate product catalog"
          git push
