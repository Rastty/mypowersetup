name: Sync affiliate products

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  products:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-products.mjs
        env:
          RESLSHOP_FEED_URL: ${{ secrets.RESLSHOP_FEED_URL }}
          SVETKARAVANU_FEED_URL: ${{ secrets.SVETKARAVANU_FEED_URL }}
      - run: node --test
      - name: Commit refreshed catalog
        run: |
          if git diff --quiet -- data/products.json; then exit 0; fi
          git config user.name "mypowersetup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- data/products.json
          git commit -m "data: refresh affiliate product catalog"
          git push
