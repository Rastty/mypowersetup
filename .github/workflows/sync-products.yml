name: Sync affiliate products

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/products.js"
      - "src/products-pt.js"
      - "src/feed.js"
      - "src/vselektro-feed.js"
      - "src/oxe-affiliate.js"
      - "src/oxe-feed.js"
      - "src/ro-recommendations.js"
      - "src/si-recommendations.js"
      - "src/powerqueen-expansion.js"
      - "src/affiliate-ampul-expansion.js"
      - "src/affiliate-solaris.js"
      - "src/affiliate-xdatou.js"
      - "src/affiliate-butler.js"
      - "src/commercial-market-config.js"
      - "src/cz-dcdc-coverage.js"
      - "scripts/sync-products.mjs"
      - "src/calculator-offer-catalog.js"
      - "scripts/sync-products-ampul-cz.mjs"
      - "scripts/sync-products-pl.mjs"
      - "scripts/sync-products-sk.mjs"
      - "scripts/sync-products-hu.mjs"
      - "scripts/sync-products-pt.mjs"
      - "scripts/sync-products-expansion-eu.mjs"
      - "scripts/write-commercial-opportunity-report.mjs"
      - "scripts/write-owner-action-queue.mjs"
      - "scripts/write-cz-dcdc-coverage.mjs"
      - "scripts/lib/*.mjs"
      - "src/shopify.js"
      - "src/affiliate-allpowers-pt.js"
      - "src/commercial-opportunity-backlog.js"
      - "src/commercial-sourcing-candidates.js"
      - "src/commercial-sourcing-priorities.js"
      - "src/commercial-owner-actions.js"
      - "src/commercial-scenarios.js"
      - "src/engine.js"
      - "src/acquisition-requirements.js"
      - "data/products-pl-verified.json"
      - "data/products-pt-verified.json"
      - "data/ampul-expansion-market-verification.json"
      - "data/solaris-affiliate-activation.json"
      - "data/xdatou-affiliate-activation.json"
      - "data/butler-affiliate-activation.json"
      - "tests/hu-foundation.test.js"
      - "tests/oxe-affiliate.test.js"
      - "tests/oxe-feed.test.js"
      - "tests/oxe-live-supplement.test.js"
      - "tests/powerqueen-exact-products.test.js"
      - "tests/powerqueen-expansion-components.test.js"
      - "tests/powerqueen-fetch-resilience.test.js"
      - "tests/solaris-expansion-activation.test.js"
      - "tests/solaris-catalog-integration.test.js"
      - "tests/xdatou-activation-data.test.js"
      - "tests/xdatou-sync.test.js"
      - "tests/xdatou-market-integration.test.js"
      - "tests/affiliate-butler.test.js"
      - "tests/butler-activation-data.test.js"
      - "tests/butler-catalog-integration.test.js"
      - "tests/shopify.test.js"
      - "tests/commercial-coverage.test.js"
      - "tests/commercial-scenarios.test.js"
      - "tests/current-catalog-safety.test.js"
      - "tests/vselektro-live-feed.test.js"
      - "tests/cz-dcdc-coverage.test.js"
      - ".github/workflows/sync-products.yml"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: affiliate-catalog-write
  cancel-in-progress: false

jobs:
  products:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      # Run deterministic repository tests against the committed, reviewed fixture catalog.
      # Live merchant feeds are mutable and may legitimately become stale/unhealthy;
      # post-sync fail-closed commercial gates below validate the refreshed catalog.
      - name: Test committed application and catalog contracts
        run: node --test
      - run: node scripts/sync-products.mjs
        env:
          RESLSHOP_FEED_URL: ${{ secrets.RESLSHOP_FEED_URL }}
          SVETKARAVANU_FEED_URL: ${{ secrets.SVETKARAVANU_FEED_URL }}
          # Optional partner feeds remain disabled until their repository secrets exist.
          SOLAR_IMPORT_FEED_URL: ${{ secrets.SOLAR_IMPORT_FEED_URL }}
          BATTERY_CZ_FEED_URL: ${{ secrets.BATTERY_CZ_FEED_URL }}
          VSELEKTRO_FEED_URL: ${{ secrets.VSELEKTRO_FEED_URL }}
      - name: Validate small, same-source CZ buyer catalog
        run: node scripts/check-calculator-offers-cz.mjs
      - name: Validate small, same-source CZ DC-DC editorial offers
        run: node scripts/check-dcdc-guide-offers-cz.mjs
      - run: node scripts/sync-products-ampul-cz.mjs
        env:
          AMPUL_CZ_FEED_URL: ${{ secrets.AMPUL_CZ_FEED_URL }}
      - run: node scripts/sync-products-sk.mjs
        env:
          PADABO_SK_FEED_URL: ${{ secrets.PADABO_SK_FEED_URL }}
          AMPUL_SK_FEED_URL: ${{ secrets.AMPUL_SK_FEED_URL }}
      - run: node scripts/sync-products-pl.mjs
        env:
          PADABO_PL_FEED_URL: ${{ secrets.PADABO_PL_FEED_URL }}
          AMPUL_PL_FEED_URL: ${{ secrets.AMPUL_PL_FEED_URL }}
      - run: node scripts/sync-products-hu.mjs
        env:
          PADABO_HU_FEED_URL: ${{ secrets.PADABO_HU_FEED_URL }}
          AMPUL_HU_FEED_URL: ${{ secrets.AMPUL_HU_FEED_URL }}
      - run: node scripts/sync-products-pt.mjs
      - run: node scripts/write-cz-dcdc-coverage.mjs
      - run: node scripts/write-commercial-opportunity-report.mjs
      - run: node scripts/write-owner-action-queue.mjs
      # Revalidate regenerated merchant data; do not commit if commercial safety fails.
      - run: npm run check:commercial:coverage:safe
      - run: npm run check:commercial:scenarios:safe
      - run: npm run check:commercial:opportunities
      - name: Commit refreshed catalog
        run: |
          FILES="data/products.json data/calculator-offers-cz.json data/dcdc-guide-offers-cz.json data/products-ampul-cz.json data/products-sk.json data/products-pl.json data/products-hu.json data/products-pt.json data/cz-dcdc-coverage.json data/commercial-opportunity-report.json data/owner-action-queue.json"
          if [[ -z "$(git status --porcelain -- $FILES)" ]]; then exit 0; fi
          git config user.name "mypowersetup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- $FILES
          git commit -m "data: refresh affiliate product catalog"
          # Generated feed data must never overwrite newer source/data commits.
          # A concurrent PR merge can move main after checkout; rebase only if
          # changes are disjoint, otherwise fail closed and let the next sync run.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "::warning::main moved during catalog generation; safe rebase attempt ${attempt}/3"
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Catalog changes conflict with newer main; refusing a force push"
              exit 1
            fi
          done
          echo "::error::Catalog refresh not pushed after 3 safe retries"
          exit 1
      - name: Prove the exact published buyer catalog after this feed sync
        # GitHub's GITHUB_TOKEN data pushes do not create ordinary push
        # workflow runs, so the daily parity workflow cannot validate them.
        # Reuse the existing exact-SHA Pages release barrier in this writer.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export GITHUB_SHA="$(git rev-parse HEAD)"
          node scripts/wait-for-pages-deployment.mjs
          node scripts/verify-buyer-paths-live.mjs
