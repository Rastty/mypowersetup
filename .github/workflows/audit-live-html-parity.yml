name: Production HTML content parity
on:
  pull_request:
    paths:
      - scripts/verify-phase2-stale-live.mjs
      - scripts/verify-phase2-stale-live.test.mjs
      - scripts/verify-buyer-paths-live.mjs
      - scripts/verify-buyer-paths-live.test.mjs
      - scripts/verify-expansion-supply-live.mjs
      - scripts/verify-expansion-supply-live.test.mjs
      - scripts/wait-for-pages-deployment.mjs
      - scripts/wait-for-pages-deployment.test.mjs
      - .github/workflows/audit-live-html-parity.yml
  workflow_dispatch:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  schedule:
    - cron: "43 7 * * *"
  # The built-in GitHub Pages dynamic workflow has not emitted workflow_run
  # events for this repository. A bounded exact-SHA deployment barrier makes
  # a targeted main push a reliable postdeploy audit trigger instead.
  push:
    branches: [main, audit/live-html-parity-20261013]
    paths:
      - .github/workflows/audit-live-html-parity.yml
      - scripts/wait-for-pages-deployment.mjs
      - scripts/wait-for-pages-deployment.test.mjs
      - scripts/verify-buyer-paths-live.mjs
      - scripts/verify-buyer-paths-live.test.mjs
      - scripts/verify-expansion-supply-live.mjs
      - scripts/verify-expansion-supply-live.test.mjs
      - scripts/verify-phase2-stale-live.mjs
      - scripts/verify-phase2-stale-live.test.mjs
      - src/guide-verified-offers.js
      - src/verified-offer-catalog-fetch.js
      - src/calculator-offer-catalog.js
      - src/battery-calculator-offers*.js
      - src/mppt-calculator-offers*.js
      - src/calculator-landing-browser.js
      - src/expansion-calculator-browser.js
      - src/expansion-supply-evidence.js
      - src/expansion-line-price.js
      - src/expansion-recommendation-roles.js
      - pt/index.html
      - ro/index.html
      - si/index.html
      - src/guide-offer-impressions.js
      - data/calculator-offers-cz.json
      - data/dcdc-guide-offers-cz.json
      - data/products.json
      - pruvodce/**
      - kalkulacky/**
permissions:
  contents: read
  actions: read
concurrency:
  group: audit-production-html-content-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Wait for the exact GitHub Pages commit to finish deploying
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/wait-for-pages-deployment.mjs
      - name: Fetch all published HTML routes and compare substantive content
        run: node scripts/audit-live-html-parity.mjs
      - name: Test exact-route public readback contract
        run: node --test scripts/verify-phase2-stale-live.test.mjs
      - name: Verify both live electrical calculator HTML pages and served JS
        # PRs intentionally contain a future script version absent from live
        # Pages. Enforce the live check only after the exact main SHA deploys
        # (or in independent scheduled/dispatch/workflow_run audits).
        if: github.event_name != 'pull_request'
        run: node scripts/verify-phase2-stale-live.mjs
      - name: Test public buyer paths and exact served asset contract
        run: node --test scripts/verify-buyer-paths-live.test.mjs
      - name: Verify public buyer HTML, JS and reviewed compact catalog after deployment
        # PR code may intentionally differ from currently deployed production.
        # Exact source parity is asserted on targeted main pushes ONLY after
        # the matching Pages deployment is successful; schedule/dispatch also
        # perform independent checks and workflow_run remains a fallback.
        if: github.event_name != 'pull_request'
        run: node scripts/verify-buyer-paths-live.mjs
      - name: Test PT RO SI public served calculator and supply outcome contract
        run: node --test scripts/verify-expansion-supply-live.test.mjs
      - name: Verify exact PT RO SI served HTML and versioned supply JS
        # The new branch code is not deployed during PR checks.
        # Run the live check only after the expected main Pages commit deploys,
        # and from schedule/dispatch/workflow_run where production is current.
        if: github.event_name != 'pull_request'
        run: node scripts/verify-expansion-supply-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-html-content-parity
          path: live-content-audit.json
