name: Normalize public expansion copy

on:
  push:
    branches: [postlaunch-hardening-20260830]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: postlaunch-hardening-20260830
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: node scripts/normalize-public-expansion-copy.mjs
      - name: Commit normalized public output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pt si ro
          git diff --cached --quiet && exit 0
          git commit -m "fix: normalize public expansion copy"
          git push origin HEAD:postlaunch-hardening-20260830
