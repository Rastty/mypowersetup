name: Patch 409 localized calculators

on:
  push:
    branches: [feat/409-core-market-calculators]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[patch-409]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/409-core-market-calculators
      - name: Patch calculator discovery surfaces
        run: python scripts/patch-409-localized-calculators.py
      - name: Commit rollout integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "feat: integrate localized calculator discovery"
          git push origin HEAD:feat/409-core-market-calculators
