name: Regenerate expansion navigation

on:
  push:
    branches:
      - fix/expansion-primary-navigation

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/expansion-primary-navigation
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/publish-expansion.mjs --market pt
      - run: node scripts/publish-expansion.mjs --market ro
      - run: node scripts/publish-expansion.mjs --market si
      - name: Commit regenerated public pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pt/index.html ro/index.html si/index.html index.html sk/index.html pl/index.html hu/index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Publish complete expansion navigation"
            git push origin HEAD:fix/expansion-primary-navigation
          fi
