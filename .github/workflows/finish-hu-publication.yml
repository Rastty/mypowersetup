name: Finish HU publication transition

on:
  push:
    branches:
      - publish/hu-first-publication

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Update committed-state HU expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/hu-foundation.test.js')
          s = p.read_text()
          replacements = {
            'test("Hungarian analytics copy is ready without activating an unfinished public route", async () => {': 'test("Hungarian analytics copy is active on the published Hungarian route", async () => {',
            'assert.doesNotMatch(sitemap, /mypowersetup\\.com\\/hu\\//);': 'assert.match(sitemap, /mypowersetup\\.com\\/hu\\//);',
            'for (const html of [czech, slovak, polish]) assert.doesNotMatch(html, /hreflang="hu-HU"/);': 'for (const html of [czech, slovak, polish]) assert.match(html, /hreflang="hu-HU"/);',
            'test("Hungarian private page template covers the full mobile purchase journey without publishing it", async () => {': 'test("Hungarian private page template stays noindex while committed HU output is public", async () => {',
            'assert.equal(await fileExists("hu/index.html"), false);': 'assert.equal(await fileExists("hu/index.html"), true);',
            'test("Hungarian trust pages are complete but remain private until market launch", async () => {': 'test("Hungarian trust source pages stay private while committed public pages exist", async () => {',
            'assert.equal(await fileExists(`${HU_TRUST_ROUTES[kind].slice(1)}index.html`), false);': 'assert.equal(await fileExists(`${HU_TRUST_ROUTES[kind].slice(1)}index.html`), true);',
            'test("Hungarian core guides preserve calculator assumptions while remaining private", async () => {': 'test("Hungarian core guide sources preserve assumptions while committed public guides exist", async () => {',
            'assert.equal(await fileExists(`${HU_GUIDE_ROUTES[kind].slice(1)}index.html`), false);': 'assert.equal(await fileExists(`${HU_GUIDE_ROUTES[kind].slice(1)}index.html`), true);',
          }
          for old, new in replacements.items():
            if old not in s:
              print(f'pattern already changed or missing: {old[:70]}')
            s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Regenerate Hungarian public files
        env:
          HU_LANGUAGE_REVIEWED: 'true'
          HU_MOBILE_JOURNEY_REVIEWED: 'true'
        run: npm run publish:hu
      - run: npm test
      - name: Commit transition fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/hu-foundation.test.js hu index.html sk/index.html pl/index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Finish Hungarian publication transition"
            git push
          fi
