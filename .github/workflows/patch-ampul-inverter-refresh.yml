name: Patch Ampul inverter refresh regression

on:
  push:
    branches: [fix/ampul-inverter-refresh]
    paths: [.github/workflows/patch-ampul-inverter-refresh.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/ampul-inverter-refresh
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Patch refresh and add regression test
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/products.js')
          s=p.read_text()
          needle='''  if (/solární regulátory|solárne regulátory|regulatory (?:solarne|ładowania)|napelemes töltésszabályozók|töltésszabályozók|battery charge controllers/i.test(product.categoryPath)) {\n    specs.currentA = extractControllerCurrent(product.name, product.description);\n  }\n'''
          repl='''  const ampulVariantId = String(product.id || "").split(":").at(-1);\n  const ampulVariantVoltage = product.merchant?.startsWith("ampul_")\n    ? AMPUL_VERIFIED_INVERTER_VARIANTS[ampulVariantId]\n    : null;\n  if (ampulVariantVoltage) {\n    specs.voltageV = ampulVariantVoltage;\n    specs.pureSine = true;\n  }\n  if (/solární regulátory|solárne regulátory|regulatory (?:solarne|ładowania)|napelemes töltésszabályozók|töltésszabályozók|battery charge controllers/i.test(product.categoryPath)) {\n    specs.currentA = extractControllerCurrent(product.name, product.description);\n  }\n'''
          if needle not in s: raise SystemExit('refresh insertion point not found')
          p.write_text(s.replace(needle,repl,1))
          Path('tests/ampul-inverter-refresh-regression.test.js').write_text('''import test from "node:test";\nimport assert from "node:assert/strict";\nimport { refreshCatalogProduct, recommendProducts } from "../src/products.js";\n\nconst ampul24 = {\n  id: "ampul_sk:5577-7392",\n  merchant: "ampul_sk",\n  name: "Menič napätia z DC na 230V AC, 50Hz, 2000W - 24 V DC",\n  description: "Invertor",\n  categoryPath: "Meniče napätia",\n  category: "inverter",\n  available: null,\n  specs: { voltageV: 24, powerW: 2000, pureSine: true }\n};\n\ntest("refresh preserves verified Ampul inverter variant voltage and pure sine evidence", () => {\n  const refreshed = refreshCatalogProduct(ampul24);\n  assert.equal(refreshed.specs.voltageV, 24);\n  assert.equal(refreshed.specs.pureSine, true);\n  assert.equal(refreshed.category, "inverter");\n});\n\ntest("24 V Ampul 2000 W inverter remains eligible for a 1700 W setup after refresh", () => {\n  const recommendations = recommendProducts([ampul24], {\n    locale: "sk", systemVoltage: 24, inverterWatts: 1700,\n    solarWatts: 0, controllerAmps: 0, batteryAh: 0, batteryType: "lifepo4",\n    charging: { dcDc: { suggestedCurrentAmps: null }, shore: { suggestedCurrentAmps: null } }\n  });\n  assert.equal(recommendations.inverter.length, 1);\n  assert.equal(recommendations.inverter[0].product.id, ampul24.id);\n});\n''')
          PY
          rm .github/workflows/patch-ampul-inverter-refresh.yml
      - run: npm test
      - name: Commit fix
        run: |
          git config user.name "mypowersetup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/products.js tests/ampul-inverter-refresh-regression.test.js .github/workflows/patch-ampul-inverter-refresh.yml
          git commit -m "Fix verified Ampul inverter refresh"
          git push origin HEAD:fix/ampul-inverter-refresh