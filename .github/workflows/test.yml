name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  calculator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm test
      - run: node --check src/app.js
      - run: node --check src/app-hu.js
      - run: node --check scripts/publish-hu.mjs
