name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  calculator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm test
      - run: node --check src/app.js
      - run: node --check src/app-hu.js
      - run: node --check src/analytics-context.js
      - run: node --check src/analytics.js
      - run: node --check src/community-navigation.js
      - run: node --check src/public-conversion-funnel.js
      - run: node --check src/calculator-funnel-report.js
      - run: node --check src/calculator-growth-priority.js
      - run: node --check src/calculator-growth-input.js
      - run: node --check src/ga4-live-baseline.js
      - run: node --check src/commercial-coverage.js
      - run: node --check src/commercial-verification-evidence.js
      - run: node --check src/ampul-market-verification.js
      - run: node --check src/ampul-source-stock.js
      - run: node --check src/affiliate-solaris.js
      - run: node --check src/commercial-system-verification-actions.js
      - run: node --check src/market-health.js
      - run: node --check src/traffic-distribution.js
      - run: node --check src/public-link-graph.js
      - run: node --check src/community-attribution.js
      - run: node --check scripts/sync-products.mjs
      - run: node --check scripts/sync-products-pt.mjs
      - run: node --check scripts/sync-products-expansion-eu.mjs
      - run: node --check scripts/lib/sync-solaris-eu.mjs
      - run: node --check scripts/check-market-health.mjs
      - run: node --check scripts/preaudit.mjs
      - run: node --check scripts/publish-hu.mjs
      - run: node --check scripts/submit-indexnow.mjs
      - run: node --check scripts/check-expansion-release.mjs
      - run: node --check scripts/sync-public-hreflang.mjs
      - run: node --check scripts/check-public-conversion.mjs
      - run: node --check scripts/check-conversion-analytics.mjs
      - run: node --check scripts/check-postlaunch-public.mjs
      - run: node --check scripts/check-production-live.mjs
      - run: node --check scripts/check-commercial-coverage.mjs
      - run: node --check scripts/check-commercial-scenarios.mjs
      - run: node --check scripts/check-commercial-opportunities.mjs
      - run: node --check scripts/check-affiliate-onboarding-candidates.mjs
      - run: node --check scripts/write-owner-action-queue.mjs
      - run: node --check scripts/write-system-verification-queue.mjs
      - run: node --check scripts/check-traffic-distribution.mjs
      - run: node --check scripts/check-public-internal-links.mjs
      - run: node --check scripts/report-traffic-distribution.mjs
      - run: node --check scripts/report-community-links.mjs
      - run: node --check scripts/report-calculator-funnel.mjs
      - run: node --check scripts/report-calculator-growth.mjs
      - run: node --check scripts/report-ga4-calculator-live.mjs
      - run: node --check scripts/smoke-public-mobile.mjs
      - run: node --check scripts/smoke-hu-mobile.mjs
      - run: node --check scripts/smoke-pt-mobile.mjs
      - run: node --check scripts/smoke-si-mobile.mjs
      - run: node --check scripts/smoke-ro-mobile.mjs
      - run: npm run health:markets:safe
      - run: npm run preaudit:ready
      - run: npm run check:expansion:release
      - run: npm run check:public:hreflang
      - run: npm run check:public:conversion
      - run: npm run check:public:links
      - run: npm run check:conversion:analytics
      - run: node scripts/check-postlaunch-public.mjs
      - run: npm run check:commercial:coverage:safe
      - run: npm run check:commercial:scenarios:safe
      - name: Build commercial opportunity report
        run: npm run check:commercial:opportunities > commercial-opportunities.json
      - name: Upload commercial opportunity report
        uses: actions/upload-artifact@v4
        with:
          name: commercial-opportunities
          path: commercial-opportunities.json
          retention-days: 14
      - run: node scripts/check-affiliate-onboarding-candidates.mjs
      - run: npm run check:owner:actions
      - name: Generate current system verification queue
        run: npm run report:system:verification
      - run: npm run check:system:verification
      - run: npm run check:traffic:distribution
      - run: npm run report:community:links -- --market pl
      - run: npm run indexnow:check
      - run: google-chrome --version
      - run: npm run smoke:public:mobile
      - run: npm run smoke:hu:mobile
      - run: npm run smoke:pt:mobile
      - run: npm run smoke:si:mobile
      - run: npm run smoke:ro:mobile
