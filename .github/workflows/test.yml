name: Test

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair-mppt-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - name: Repair mature-guide promise and restore workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('pruvodce/jak-vybrat-mppt-regulator/index.html')
          text = path.read_text()
          promise = 'Výpočet je zdarma a bez registrace; po výsledku uvidíte jen produkty, které splňují vypočtené parametry.'
          marker = '<section class="cta"><h2>Spočítejte výkon panelů i vhodnou třídu MPPT</h2>'
          if promise not in text:
              if marker not in text:
                  raise SystemExit('MPPT CTA marker missing')
              text = text.replace(marker, marker + f'<p>{promise}</p>', 1)
              path.write_text(text)
          PY
          git fetch origin main --depth=1
          git show FETCH_HEAD:.github/workflows/test.yml > .github/workflows/test.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pruvodce/jak-vybrat-mppt-regulator/index.html .github/workflows/test.yml
          git diff --cached --check
          git commit -m "fix: align MPPT guide conversion promise"
          git push origin HEAD:${{ github.head_ref }}
