name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  calculator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm test
      - run: node --check src/app.js
      - run: node --check src/app-hu.js
      - run: node --check src/analytics-context.js
      - run: node --check src/analytics.js
      - run: node --check src/market-health.js
      - run: node --check scripts/check-market-health.mjs
      - run: node --check scripts/preaudit.mjs
      - run: node --check scripts/publish-hu.mjs
      - run: node --check scripts/submit-indexnow.mjs
      - run: node --check scripts/smoke-public-mobile.mjs
      - run: node --check scripts/smoke-hu-mobile.mjs
      - run: node --check scripts/smoke-pt-mobile.mjs
      - run: node --check scripts/smoke-si-mobile.mjs
      - run: npm run health:markets:safe
      - run: npm run preaudit:ready
      - run: npm run indexnow:check
      - run: google-chrome --version
      - run: npm run smoke:public:mobile
      - run: npm run smoke:hu:mobile
      - run: npm run smoke:pt:mobile
      - run: npm run smoke:si:mobile
