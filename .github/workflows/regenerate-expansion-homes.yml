name: Regenerate expansion public pages

on:
  push:
    branches: [main]
    paths:
      - "src/private-market-page.js"
      - "src/expansion-publication.js"
      - "src/search-surface.js"
      - "src/market-seed-pt.js"
      - "src/market-seed-ro.js"
      - "src/market-seed-si.js"
      - "src/private-content-pt.js"
      - "src/private-content-ro.js"
      - "src/private-content-si.js"
      - "src/expansion-search-content.js"
      - "src/expansion-search-content-ro.js"
      - "src/expansion-search-content-si.js"
      - "src/expansion-result-guides.js"
      - "src/expansion-power-station-content.js"
      - "src/contextual-growth-links.js"
      - "src/expansion-voltage-guides.js"
      - "src/public-hreflang-map.js"
      - "scripts/publish-expansion.mjs"
      - ".github/workflows/regenerate-expansion-homes.yml"

permissions:
  contents: write

concurrency:
  group: expansion-home-publication
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Regenerate public expansion pages
        run: |
          node scripts/publish-expansion.mjs --market pt
          node scripts/publish-expansion.mjs --market ro
          node scripts/publish-expansion.mjs --market si
      - name: Commit generated public-page drift
        shell: bash
        run: |
          git add index.html sk/index.html pl/index.html hu/index.html pt ro si sitemap.xml
          if git diff --cached --quiet; then
            echo "Expansion public pages already match their source."
            exit 0
          fi
          git config user.name "mypowersetup-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore: regenerate expansion public pages"
          git reset --hard HEAD
          git pull --rebase origin main
          git push origin HEAD:main
