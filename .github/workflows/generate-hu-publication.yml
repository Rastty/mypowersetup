name: Generate HU publication

on:
  push:
    branches:
      - publish/hu-first-publication

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
      - name: Generate Hungarian public files
        env:
          HU_LANGUAGE_REVIEWED: 'true'
          HU_MOBILE_JOURNEY_REVIEWED: 'true'
        run: npm run publish:hu
      - name: Commit generated publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hu index.html sk/index.html pl/index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No publication changes"
          else
            git commit -m "Generate Hungarian public publication"
            git push
          fi
