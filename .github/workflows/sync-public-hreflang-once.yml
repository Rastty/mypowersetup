name: Sync public hreflang once

on:
  push:
    branches:
      - publish-expansion-pt-si-ro

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: publish-expansion-pt-si-ro
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Sync public hreflang
        run: npm run sync:public:hreflang
      - name: Remove one-shot workflow and commit synced homes
        run: |
          git rm .github/workflows/sync-public-hreflang-once.yml
          git add index.html sk/index.html pl/index.html hu/index.html
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Sync public hreflang for expansion launch"
          git push origin HEAD:publish-expansion-pt-si-ro
