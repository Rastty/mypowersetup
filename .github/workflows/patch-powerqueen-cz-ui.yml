name: Patch Power Queen CZ UI

on:
  push:
    branches:
      - growth/powerqueen-cz-catalog

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: growth/powerqueen-cz-catalog
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Add CZ merchant label
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app.js')
          s = p.read_text()
          old = '    ampul_cz: "Ampul.eu"\n'
          new = '    ampul_cz: "Ampul.eu",\n    powerqueen_eu: "Power Queen EU"\n'
          if old not in s:
              raise SystemExit('merchant label target not found')
          p.write_text(s.replace(old, new, 1))
          PY
          node --check src/app.js
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/patch-powerqueen-cz-ui.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app.js .github/workflows/patch-powerqueen-cz-ui.yml
          git commit -m "Label Power Queen products in CZ recommendations"
          git push origin HEAD:growth/powerqueen-cz-catalog
