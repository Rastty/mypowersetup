name: Regenerate seven-market homepage money links

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "sk/index.html"
      - "pl/index.html"
      - "hu/index.html"
      - "pt/index.html"
      - "ro/index.html"
      - "si/index.html"
      - "src/homepage-money-routing.js"
      - "src/homepage-money-html.js"
      - "scripts/sync-homepage-money-links.mjs"
      - ".github/workflows/regenerate-core-home-money-links.yml"

permissions:
  contents: write

concurrency:
  group: seven-market-home-money-links-publication
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Regenerate crawlable seven-market homepage money links
        run: node scripts/sync-homepage-money-links.mjs
      - name: Verify homepage money-link transform
        run: node --test tests/homepage-money-html.test.js tests/homepage-money-routing.test.js
      - name: Commit generated homepage link drift
        shell: bash
        run: |
          git add index.html sk/index.html pl/index.html hu/index.html pt/index.html ro/index.html si/index.html
          if git diff --cached --quiet; then
            echo "Seven-market homepage money links already match their source."
            exit 0
          fi
          git config user.name "mypowersetup-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "seo: regenerate crawlable homepage money links"
          git reset --hard HEAD
          git pull --rebase origin main
          git push origin HEAD:main
