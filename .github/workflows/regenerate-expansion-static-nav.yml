name: Regenerate expansion static nav once

on:
  push:
    branches:
      - seo/regenerate-expansion-static-nav

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: seo/regenerate-expansion-static-nav
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Regenerate public expansion pages
        run: |
          npm run publish:expansion -- --market pt
          npm run publish:expansion -- --market si
          npm run publish:expansion -- --market ro
      - name: Require nav-only public diff
        shell: bash
        run: |
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(pt/index.html|si/index.html|ro/index.html)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated files:"
            echo "$unexpected"
            exit 1
          fi
      - name: Commit generated homepages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pt/index.html si/index.html ro/index.html
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Regenerate expansion static language navigation"
            git push origin HEAD:seo/regenerate-expansion-static-nav
          fi
