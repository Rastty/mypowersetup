name: Patch 408 guide calculator links

on:
  push:
    branches: [feat/408-calculator-seo-hardening]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[patch-guides]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/408-calculator-seo-hardening
      - name: Add contextual calculator links to matching guides
        run: |
          python - <<'PY'
          from pathlib import Path

          mapping = {
              'pruvodce/kapacita-baterie-do-karavanu/index.html': ('/kalkulacky/kapacita-baterie/', 'Kalkulačka baterie'),
              'pruvodce/kolik-w-solarnich-panelu/index.html': ('/kalkulacky/solarni-panely/', 'Kalkulačka soláru'),
              'pruvodce/jak-velky-menic-do-karavanu/index.html': ('/kalkulacky/vykon-menice/', 'Kalkulačka měniče'),
              'pruvodce/kabely-a-pojistky-12-v/index.html': ('/kalkulacky/prurez-kabelu-12v/', 'Kalkulačka kabelu'),
              'pruvodce/12-v-nebo-24-v-karavan/index.html': ('/kalkulacky/12v-nebo-24v/', 'Kalkulačka 12/24 V'),
          }
          needle = '<a href="/#kalkulator">Kalkulátor</a>'
          for file_name, (route, label) in mapping.items():
              path = Path(file_name)
              text = path.read_text(encoding='utf-8')
              if text.count(needle) != 1:
                  raise SystemExit(f'{file_name}: expected exactly one header calculator link, found {text.count(needle)}')
              replacement = f'<a href="{route}">{label}</a><a href="/#kalkulator">Builder</a>'
              path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY
      - name: Commit guide links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pruvodce/kapacita-baterie-do-karavanu/index.html pruvodce/kolik-w-solarnich-panelu/index.html pruvodce/jak-velky-menic-do-karavanu/index.html pruvodce/kabely-a-pojistky-12-v/index.html pruvodce/12-v-nebo-24-v-karavan/index.html
          git diff --cached --quiet && exit 1
          git commit -m "seo: connect guides to dedicated calculators"
          git push origin HEAD:feat/408-calculator-seo-hardening
