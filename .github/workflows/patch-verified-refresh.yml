name: Patch verified catalog refresh

on:
  push:
    branches:
      - growth/ampul-dcdc-exact-fit

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: growth/ampul-dcdc-exact-fit
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Preserve verified exact specs through catalog refresh
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/products.js')
          s = p.read_text()
          old = '''  const specs = Object.fromEntries(\n    Object.entries(extractedSpecs).map(([key, value]) => [key, value ?? product.specs?.[key] ?? null])\n  );'''
          new = '''  const specs = Object.fromEntries(\n    Object.entries(extractedSpecs).map(([key, value]) => {\n      const stored = product.specs?.[key];\n      const verifiedStoredValue = product.verifiedAt && (\n        (Array.isArray(stored) && stored.length > 0)\n        || stored === true\n        || typeof stored === "number" && Number.isFinite(stored)\n        || typeof stored === "string" && stored.length > 0\n      );\n      return [key, verifiedStoredValue ? stored : value ?? stored ?? null];\n    })\n  );'''
          if old not in s:
              raise SystemExit('refreshCatalogProduct target not found')
          p.write_text(s.replace(old, new, 1))
          PY
          node --test tests/ampul-dcdc-feed.test.js tests/products.test.js
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/patch-verified-refresh.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/products.js .github/workflows/patch-verified-refresh.yml
          git commit -m "Preserve verified specs through catalog refresh"
          git push origin HEAD:growth/ampul-dcdc-exact-fit
