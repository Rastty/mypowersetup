name: Patch OXE live sync gates

on:
  push:
    branches: [fix/oxe-live-sync-gates]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/oxe-live-sync-gates
      - name: Patch dynamic catalog assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, got {count}")
              p.write_text(text.replace(old, new, 1))

          replace_exact(
              "tests/content.test.js",
              '''  assert.ok(polishProducts.products.every((product) =>
              product.affiliateUrl.includes("awinmid=121776")
                || product.affiliateUrl.includes("awinmid=97025")
                || product.affiliateUrl.includes("a_bid=ddb5edae")
            ));''',
              '''  assert.ok(polishProducts.products.every((product) =>
              product.affiliateUrl.includes("awinmid=121776")
                || product.affiliateUrl.includes("awinmid=97025")
                || product.affiliateUrl.includes("a_bid=ddb5edae")
                || (
                  product.merchant === "oxe_pl"
                  && new URL(product.affiliateUrl).hostname === "go.dognet.com"
                  && new URL(product.affiliateUrl).searchParams.get("chid") === "2mRVFbhJ"
                  && new URL(new URL(product.affiliateUrl).searchParams.get("url")).hostname === "www.oxepower.pl"
                )
            ));'''
          )

          replace_exact(
              "tests/hu-foundation.test.js",
              'test("Hungarian catalog combines local Ampul and verified ALLPOWERS EU sources privately", async () => {',
              'test("Hungarian catalog combines local Ampul, verified EU and approved OXE sources privately", async () => {'
          )
          replace_exact(
              "tests/hu-foundation.test.js",
              '  assert.equal(catalog.sources.allpowers_eu.technicallyVerifiedPowerStations, 3);',
              '  assert.ok(catalog.sources.allpowers_eu.technicallyVerifiedPowerStations >= 3);\n  assert.match(sync, /syncOxeMarket\\("hu", previousCatalog\\)/);'
          )

          replace_exact(
              "tests/shopify.test.js",
              '    assert.equal(eu.filter(({ category }) => category === "solar_panel").length, 22);\n    assert.equal(eu.filter(({ category }) => category === "power_station").length, 3);',
              '    assert.ok(eu.filter(({ category }) => category === "solar_panel").length >= 22);\n    assert.ok(eu.filter(({ category }) => category === "power_station").length >= 3);'
          )

          replace_exact(
              "tests/si-recommendations.test.js",
              'test("Slovenia catalog is public and accepts only exact ALLPOWERS EU destinations with market evidence", () => {',
              'test("Slovenia catalog is public and keeps exact ALLPOWERS destinations alongside strict local merchants", () => {'
          )
          replace_exact(
              "tests/si-recommendations.test.js",
              '  const product = catalog.products[0];\n  const parsed = parseSloveniaAffiliateUrl(product.affiliateUrl);',
              '  const product = catalog.products.find(({ merchant }) => merchant === "allpowers_eu");\n  assert.ok(product);\n  const parsed = parseSloveniaAffiliateUrl(product.affiliateUrl);'
          )
          replace_exact(
              "tests/si-recommendations.test.js",
              '  assert.equal(fitting.power_station[0].merchant, "allpowers_eu");',
              '  assert.ok(["allpowers_eu", "oxe_si"].includes(fitting.power_station[0].merchant));'
          )

          Path(".github/workflows/patch-oxe-live-sync-gates.yml").unlink()
          PY
      - name: Commit gate fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests .github/workflows/patch-oxe-live-sync-gates.yml
          git commit -m "Fix live OXE catalog regression gates"
          git push
