name: Regenerate expansion search surface

on:
  push:
    branches:
      - seo/expansion-home-entity-graph

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: seo/expansion-home-entity-graph
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/publish-expansion.mjs --market pt
      - run: node scripts/publish-expansion.mjs --market si
      - run: node scripts/publish-expansion.mjs --market ro
      - name: Commit regenerated public pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pt si ro index.html sk/index.html pl/index.html hu/index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Regenerate expansion search metadata"
            git push origin HEAD:seo/expansion-home-entity-graph
          fi
